services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tetra
      POSTGRES_PASSWORD: tetra
      POSTGRES_DB: tetra
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetra -d tetra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    env_file: apps/core/.env
    environment:
      POSTGRES_URL: postgres://tetra:tetra@postgres:5432/tetra
      REDIS_URL: redis://redis:6379
    ports:
      - "${CORE_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
