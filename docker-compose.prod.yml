# Production stack for Coolify (Docker Compose build pack). Local dev uses docker-compose.yml.
# Domains are assigned in Coolify per service: web → port 80, core → port 3002.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tetra
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: tetra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetra -d tetra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    expose:
      - "3002"
    environment:
      ENV: production
      API_ENABLED: "true"
      PORT: 3002
      POSTGRES_URL: postgres://tetra:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/tetra
      REDIS_URL: redis://redis:6379
      DISCORD_BOT_ID: ${DISCORD_BOT_ID:?}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID:?}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET:?}
      INVITE_LINK: ${INVITE_LINK:?}
      BACKEND_URL: ${BACKEND_URL:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
      SESSION_KEYS: ${SESSION_KEYS:?}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:?}
      TWITCH_SECRET_KEY: ${TWITCH_SECRET_KEY:?}
      TENOR_API_KEY: ${TENOR_API_KEY:?}
      IMGUR_CLIENT_ID: ${IMGUR_CLIENT_ID:?}
      ERROR_LOG_CHANNEL_ID: ${ERROR_LOG_CHANNEL_ID:-}
      MEDIA_COOKIES: ${MEDIA_COOKIES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://tetra.lol}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    environment:
      # Read by Caddy at runtime for the /invite redirect
      INVITE_LINK: ${INVITE_LINK:?}
    expose:
      - "80"

volumes:
  postgres-data:
  redis-data:
